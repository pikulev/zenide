# Только терминал с историей: без окон проекта, хуков и вложенных попапов.
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g status off
set -g mouse on
set -g escape-time 0
set -g exit-unattached on
set -g prefix C-Space
unbind C-b
setw -g mode-keys vi
bind -N "прочее: послать C-Space в приложение" C-Space send-prefix
bind -N "copy-mode: начать выделение" -T copy-mode-vi v send -X begin-selection
bind -N "copy-mode: скопировать выделение и выйти" -T copy-mode-vi y send -X copy-selection-and-cancel
