# tmux — минимальный конфиг под session-per-project.
# Живёт в ~/.config/tmux/ (как остальные твои TUI-конфиги).

# ── корни: где лежит zenide и где личный профиль ───────
# $ZENIDE_ROOT / $ZENIDE_PROFILE задаёт лаунчер (./try, тесты, запись демо).
# Пусто = обычная установка, оба на штатных местах. Благодаря этому конфиг
# не привязан к ~/.config и поднимается из любого каталога.
#
# Ниже ДВА разных способа подстановки — это не стиль, а механика tmux:
#   · run-shell / display-popup -E / #() идут через sh → `\$VAR`: экранированный
#     доллар оставляет подстановку шеллу, а sh видит то, что выставил setenv -g;
#   · source-file разбирает сам tmux → `-F` и тернарник по формату, потому что
#     setenv -g НЕ виден раскрытию $VAR в этом же разборе конфига (проверено:
#     без него путь молча становится пустым).
# Писать `${VAR:-default}` НЕЛЬЗЯ: tmux давится и роняет весь конфиг целиком.
setenv -gF ZENIDE_ROOT "#{?#{==:$ZENIDE_ROOT,},#{?#{==:$XDG_CONFIG_HOME,},$HOME/.config,$XDG_CONFIG_HOME}/zenide,$ZENIDE_ROOT}"

# $ZENIDE_PROFILE намеренно НЕ выставляется здесь: где лежит профиль — знает
# один `bin/zenide` (переменная → якорь ~/.config/zenide-profile → профиль в
# клоне). Выставь tmux якорь вслепую — подкоманды получили бы его даже там,
# где якоря нет, и потеряли бы последнюю ступень. Строки source-file ниже
# берут переменную, если лаунчер её задал, иначе якорь; `-q` делает его
# отсутствие не ошибкой.

# ── база ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"      # truecolor для всех терминалов
set -g mouse on
set -g base-index 1                      # окна нумеруются с 1
setw -g pane-base-index 1
set -g renumber-windows on               # без дыр в нумерации окон
set -g escape-time 0                     # без задержки Esc — важно для helix/vim
set -g focus-events on                   # редакторы видят фокус
set -g history-limit 50000
set -g allow-passthrough on              # пропускать escape-запросы приложений (yazi: фикс TRT + превью)

# ── prefix: C-Space вместо неудобного C-b ──────────────
# (C-a конфликтует с "в начало строки" в шелле; C-Space свободен)
unbind C-b
set -g prefix C-Space
bind -N "прочее: послать C-Space в приложение" C-Space send-prefix

# ── ЗАМЕТКИ -N: это и есть справка ─────────────────────
# `-N "группа: описание"` на КАЖДОМ своём бинде. Зачем: prefix ? — это
# list-keys -N, а он печатает ТОЛЬКО бинды с заметкой (у 76 дефолтных tmux она
# своя, у кастомных без -N её нет → в справке их не было видно вообще).
# Группа перед «: » разносит клавиши по секциям попапа zenide keys; список групп и
# их порядок — ORDER в zenide keys. Клавиша, описание и группа живут одной строкой
# рядом с самим биндом → второго места для данных нет.

# ── vi-режим в copy-mode ───────────────────────────────
setw -g mode-keys vi
bind -N "copy-mode: начать выделение"              -T copy-mode-vi v send -X begin-selection
bind -N "copy-mode: скопировать выделение и выйти" -T copy-mode-vi y send -X copy-selection-and-cancel

# ── сплиты и окна в текущем каталоге ───────────────────
bind -N "панели: сплит вправо (в cwd пейна)" '\' split-window -h -c "#{pane_current_path}"
bind -N "панели: сплит вниз (в cwd пейна)"   -   split-window -v -c "#{pane_current_path}"
bind -N "окна: новое окно (в cwd пейна)"     c   new-window   -c "#{pane_current_path}"

# ── навигация по панелям hjkl ──────────────────────────
bind -N "панели: влево"  h select-pane -L
bind -N "панели: вниз"   j select-pane -D
bind -N "панели: вверх"  k select-pane -U
bind -N "панели: вправо" l select-pane -R

# ── перезагрузка конфига ───────────────────────────────
# -F: путь считается форматом в момент нажатия. Тернарник, а не $ZENIDE_ROOT,
# по причине из шапки — к source-file переменная из setenv -g не доезжает.
bind -N "прочее: перечитать tmux.conf" r source-file -F "#{?#{==:$ZENIDE_ROOT,},$HOME/.config/tmux/tmux.conf,$ZENIDE_ROOT/ide/tmux/tmux.conf}" \; display "tmux config reloaded"

# ── СЕССИИ = ПРОЕКТЫ ───────────────────────────────────
# prefix f → фаззи-переключатель проектов (создать/переключиться)
bind -N "проекты: фаззи-переключатель проектов (создать/переключиться)" f display-popup -E -w 60% -h 60% "\$ZENIDE_ROOT/bin/zenide project"
# prefix s → дерево живых сессий (встроенное choose-tree)
bind -N "проекты: дерево живых сессий" s choose-tree -Zs
# prefix o → фаззи-пикер ФАЙЛОВ проекта в попапе → открыть в работающем hx.
# fzf --scheme=path ранжирует имена файлов выше совпадений по имени каталога
# (то, чего не умеет hx Space f). Корень = #{session_path}, как YAZI_ROOT.
bind -N "файлы: фаззи-пикер файлов проекта → hx" o display-popup -E -d "#{session_path}" -w 80% -h 80% "\$ZENIDE_ROOT/bin/zenide files"

# ── git-TUI в ПОСТОЯННОМ окне ──────────────────────────
# prefix g → просто переключиться (состояние TUI не трогаем). Какой именно
# TUI — слот `git_tui` в профиле (lazygit | gitui | tig); окно и его имя
# поднимает `zenide window`, поэтому здесь ни имени, ни env-переменных.
bind -N "git: git-TUI в постоянном окне" g run-shell "\$ZENIDE_ROOT/bin/zenide window git"
# prefix G → контекстный прыжок: встать на текущий файл hx в Files
bind -N "git: git-TUI на текущем файле hx" G run-shell "\$ZENIDE_ROOT/bin/zenide jump git"

# ── КОНЦЕПЦИЯ: сессия = IDE (один проект), окна = контексты ──
# hx / yazi / lazygit / (claude, логи, …) — каждый контекст в своём окне,
# строчные клавиши переключают, заглавные несут контекст текущего файла hx,
# попапы (f, …) — для быстрых одноразовых действий.

# prefix Enter → «домой» в hx (нет hx в сессии — поднимет от корня проекта)
bind -N "файлы: «домой» в hx (нет — поднять от корня проекта)" Enter run-shell "\$ZENIDE_ROOT/bin/zenide goto"

# prefix D → попап: дифф ханка под курсором hx (файл+строка из статусбара)
bind -N "git: дифф ханка под курсором hx" D display-popup -E -w 85% -h 80% "\$ZENIDE_ROOT/bin/zenide diff"
# prefix B → попап: ИНТЕРАКТИВНЫЙ blame файла hx, курсор на текущей строке.
# fzf-список + превью диффа коммита; внутри — Enter дифф целиком, C-l история
# ИМЕННО этой строки (git log -L), C-o файл на той ревизии в hx, C-d прежний
# статичный blame, C-y sha, C-g lazygit по файлу. Шире остальных попапов (90%):
# в строке и мета-колонки (sha/автор/дата), и сам код.
bind -N "git: интерактивный blame файла hx" B display-popup -E -w 90% -h 85% "\$ZENIDE_ROOT/bin/zenide blame"

# ── файловый менеджер в ПОСТОЯННОМ окне ────────────────
# Enter на файле в yazi → `zenide open`: файл уходит в работающий hx,
# фокус переключается на его окно; yazi продолжает жить в своём.
#
# prefix e → просто переключиться (нет окна — создать от корня проекта;
# YAZI_ROOT — граница для плагина leave-guard: выше неё yazi не поднимается).
# Корень и env выставляет `zenide window` — он же знает, что cwd пейна брать
# нельзя: оттуда, откуда нажали, бывает подпапка или дом.
bind -N "файлы: файловый менеджер в постоянном окне" e run-shell "\$ZENIDE_ROOT/bin/zenide window files"
# prefix E → контекстный прыжок: yazi на каталоге ТЕКУЩЕГО файла hx,
# курсор на нём (файл берётся у hx через `zenide ctx` — см. jump.d/yazi)
bind -N "файлы: yazi на каталоге текущего файла hx" E run-shell "\$ZENIDE_ROOT/bin/zenide jump files"
# prefix Tab — прыжок в предыдущее окно (hx ↔ yazi туда-сюда)
bind -N "окна: предыдущее окно (hx ↔ yazi)" Tab last-window
# yazi живёт в окне, а не в попапе → своего скрипта-обёртки у него нет; строка
# для шпаргалки C-Space ? лежит здесь (zenide keys грепает `# keys:` и в tmux.conf,
# метка — до первого « · »)
# keys: yazi · Enter файл → в работающий hx · q выход · выше YAZI_ROOT не поднимается

# при смене окна: если в новом окне hx — впрыснуть :reload-all (у hx нет
# autoread; диск мог поменяться в git-TUI/попапе). См. editor/helix/reload
set-hook -g session-window-changed 'run-shell "\$ZENIDE_ROOT/bin/zenide reload #{window_id}"'

# ── поиск по проекту ───────────────────────────────────
# prefix / → live-grep через ripgrep-all (rga) в попапе → открыть в работающем hx.
# rga ищет ТЕКСТ и внутри PDF/Office/zip/sqlite; fzf гонит rga на каждый ввод,
# Enter → file:line уходит в hx (zenide grep). Корень = #{session_path}, как o.
bind -N "поиск: live-grep по проекту (rga) → hx" / display-popup -E -d "#{session_path}" -w 90% -h 85% "\$ZENIDE_ROOT/bin/zenide grep"
# prefix R → scooter: search & replace по проекту (окно, VS Code-форма с глобами
# include/exclude и case/word-тумблерами; «e» на результате → файл:строка в hx).
bind -N "поиск: замена по проекту" R run-shell "\$ZENIDE_ROOT/bin/zenide window search"
# scooter тоже в окне, без скрипта-обёртки → строка для шпаргалки здесь
# keys: scooter · e на результате → файл:строка в hx · Tab глобы include/exclude

# ── попап-терминал ─────────────────────────────────────
# prefix Space → одноразовый шелл поверх всего, в cwd текущего пейна;
# сделал дело — exit/C-d, попап исчез (состояние не хранится — это фича)
bind -N "прочее: попап-терминал в cwd пейна" Space display-popup -E -d "#{pane_current_path}" -w 80% -h 75%

# ── справка по ВСЕМУ сетапу ────────────────────────────
# prefix ? → zenide keys: попап с фаззи-фильтром, секции из групп в заметках -N,
# клавиши внутри попапов из `legend=`/`# keys:`, дефолты tmux снизу.
# Перебивает дефолтный list-keys -N (плоский алфавитный список без секций).
bind -N "справка: эта шпаргалка" '?' display-popup -E -w 80% -h 85% "\$ZENIDE_ROOT/bin/zenide keys"

# ── статус-бар: СОДЕРЖИМОЕ (краска — в profile/theme.conf) ──
# слева от часов — git-статус проекта теми же символами, что в промпте шелла
# (`zenide status`). Сессия = проект → #{session_path}; формат ВНУТРИ #()
# раскрывается (в отличие от display-popup), путь в кавычках — пробелы в именах.
# `#[default]` после #(): статус красит сам себя, и цвета надо вернуть к
# status-style — иначе часы унаследуют цвет последнего счётчика.
set -g status-right "#(\$ZENIDE_ROOT/bin/zenide status '#{session_path}')#[default]%H:%M "
set -g status-right-length 80            # дефолтных 40 на ветку+счётчики+часы мало
set -g status-interval 5                 # как часто крутится `zenide status` (деф. 15)
set -g status-left-length 40
# не ждать тика после коммита в git-TUI: на смене окна/сессии перерисовать бар
# (-ga, чтобы не затереть reload и модули; сам job чаще раза в секунду не бежит)
set-hook -ga session-window-changed 'refresh-client -S'
set-hook -ga client-session-changed 'refresh-client -S'

# ── личный слой ────────────────────────────────────────
# -q: нет файла — не ошибка, значит ядро поднимается и на чистой машине.
# Порядок важен: тема, потом свои бинды (могут перебить любой бинд выше).
source-file -qF "#{?#{==:$ZENIDE_PROFILE,},#{?#{==:$XDG_CONFIG_HOME,},$HOME/.config,$XDG_CONFIG_HOME}/zenide-profile,$ZENIDE_PROFILE}/theme.conf"
source-file -qF "#{?#{==:$ZENIDE_PROFILE,},#{?#{==:$XDG_CONFIG_HOME,},$HOME/.config,$XDG_CONFIG_HOME}/zenide-profile,$ZENIDE_PROFILE}/local.conf"

# ── модули (opt-in поведение) ──────────────────────────
# Что включено — `modules` в profile/modules.conf; ядро о модулях не знает
# ничего, они регистрируют себя сами. Загрузчик — ОТЛОЖЕННЫЙ run-shell,
# поэтому модули видят ВСЕ бинды, включая личные из local.conf: source-file
# синхронный, а run-shell стартует после разбора всего конфига. На этом же
# свойстве держатся кириллические двойники — они накрывают и личные бинды.
run-shell "\$ZENIDE_ROOT/bin/zenide modules load"
