# Минимум, который zenide требует от yazi. Врежь в свой
# ~/.config/yazi/yazi.toml — полный ide/yazi/ ставить не обязательно
# (там ещё тема, linemode, git-статус файлов, правила для json/yaml).
#
# Проверяется `zenide doctor`, раздел «требования к соседям».

# Enter на файле → в РАБОТАЮЩИЙ hx этой tmux-сессии: окно с yazi остаётся
# жить, фокус переключается на окно hx. Без этого Enter поднимет отдельный
# $EDITOR поверх yazi — то есть второй инстанс редактора, мимо всей шины.
#
# $ZENIDE_ROOT приезжает из окружения tmux; запасное значение — на случай
# запуска yazi вне tmux.
[opener]
edit = [
  { run = '"${ZENIDE_ROOT:-$HOME/.config/zenide}/bin/zenide" open "$1"', desc = "Helix (текущий инстанс)", for = "unix" },
]
