# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasPickering/slumber/refs/tags/v5.3.0/schemas/config.json
# ^ This enables schema validation and autocomplete in your editor
# https://github.com/redhat-developer/yaml-language-server

# For configuration options, see:
# https://slumber.lucaspickering.me/api/configuration/index.html

input_bindings:
  submit: [enter]

editor: hx
pager: less -R

# --- Тема: Monokai Pro Spectrum ---
# HEX намеренно: терминальная палитра Spectrum ремапит ANSI-цвета
# (blue->оранжевый и т.п.), из-за чего дефолтная тема slumber гасла в серый.
# Hex палитра не трогает — цвета точные.
theme:
  primary_color: "#948ae3" # выделение / selected tab / активный элемент
  primary_text_color: "#222222" # текст поверх выделения (тёмный, контраст)
  secondary_color: "#5ad4e6" # cyan-акцент
  success_color: "#7bd88f" # зелёный
  error_color: "#fc618d" # красный
  background_color: "#222222"
  text_color: "#f7f1ff" # обычный текст
  hint_text_color: "#69676c" # подсказки/приглушённое
  disabled_color: "#69676c" # недоступное
  border_color: "#69676c" # рамки панелей
  alternate_row_background_color: "#2d2a2e"
  syntax:
    string_color: "#fce566" # жёлтый
    number_color: "#948ae3" # фиолетовый
    comment_color: "#69676c" # серый
    escape_color: "#fd9353" # оранжевый
    builtin_color: "#5ad4e6" # cyan
    special_color: "#fc618d" # красный
