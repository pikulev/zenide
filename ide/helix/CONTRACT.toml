# Минимум, который zenide требует от helix. Врежь это в свой
# ~/.config/helix/config.toml — полный ide/helix/ ставить не обязательно,
# он референс-реализация и вкус (темы, languages.toml, превью markdown).
#
# Проверяется `zenide doctor`, раздел «требования к соседям».

# ЕДИНСТВЕННОЕ обязательное требование.
#
# Зачем: у helix нет autoread (25.07.1), поэтому при входе в окно с hx zenide
# впрыскивает `:reload-all` — диск мог измениться от discard/edit hunk в
# git-TUI или от git-команды в попапе. Без focus-lost этот reload затрёт
# НЕСОХРАНЁННЫЕ правки: при уходе из hx буферы ещё не на диске.
#
# То есть настройка не про удобство, а про сохранность данных.
[editor.auto-save]
focus-lost = true
