# Минимум, который нужен, чтобы scooter отдавал результаты в работающий hx.
# Врежь в свой ~/.config/scooter/config.toml.
#
# Это слой `slot`: без него scooter работает сам по себе, просто «открыть
# результат» не уедет в hx.

[editor_open]
# ВАЖНО: %file НЕ оборачивать в свои кавычки — scooter сам шелл-экранирует
# подстановку; двойное квотирование даёт имя с кавычками внутри → ENOENT.
# realpath — scooter отдаёт путь относительно своего cwd, а hx может жить
# в другом. exit = false: окно search персистентное, scooter остаётся жить.
command = '"${ZENIDE_ROOT:-$HOME/.config/zenide}/bin/zenide" open "$(realpath %file)" %line'
exit = false

# Защита от дефолта «Enter = заменить»: с пустым полем Replace это тихое
# УДАЛЕНИЕ найденного. Enter открывает результат, замена — только C-r.
[keys.search.results]
trigger_replacement = "C-r"
open_in_editor = ["enter", "e"]
