# Откуда `zenide project` (C-Space f) берёт список проектов.
# Это ДАННЫЕ, а не код: ядро путей не знает. Без этого файла работает
# автодетект обычных мест (~/code, ~/projects, ~/src, ~/dev, иначе $HOME) —
# чаще всего его и хватает, поэтому по умолчанию здесь ничего не задано.
#
# Переменные уже инициализированы ядром, так что можно и `=` (перебить
# целиком), и `+=` (добавить к автодетекту):
#
#   roots       — каталоги, где ЛЕЖАТ проекты: в список идут их подкаталоги
#   standalone  — отдельные проекты, попадающие в список САМИ (не их дети)
#   containers  — контейнеры мультирепо: сами НЕ проекты, а дети — да.
#                 Детям даётся префикс контейнера (container_child), чтобы имена
#                 сессий не путались с одноимёнными проектами в roots.
#
# Примеры:
#   roots=("$HOME/work" "$HOME/code")
#   standalone+=("$HOME/myconfig")
#   containers+=("$HOME/code/monorepo")

# Рабочее и прочее личное — в projects.local (под .gitignore): в публичной
# истории не должно быть ни названий работодателей, ни внутренних проектов.
# shellcheck source=/dev/null
[ -r "$ZENIDE_PROFILE/projects.local" ] && . "$ZENIDE_PROFILE/projects.local"
