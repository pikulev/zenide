# Тема tmux — ВКУС, не механика. Правь здесь, ядро не трогай.
# Сорсится из ide/tmux/tmux.conf через `source-file -q`, то есть отсутствие
# файла не ошибка: без него бар будет дефолтный зелёный tmux.
#
# Monokai Pro Spectrum: bg #222222, fg #f7f1ff, dim #69676c, selection #525053.
# UI сдержанный: без скруглённых капсул и powerline-глифов, цвет только по смыслу.
# В темах — только hex: ANSI-имена идут через палитру терминала, и `blue` там
# оказывается оранжевым (#fd9353).

# фон = фон терминала → бар сливается с окном; тона серые, без акцентов
set -g status-position bottom
set -g status-style "bg=#222222,fg=#69676c"
# имя сессии = имя проекта, единственный акцентный элемент
set -g status-left "#[bg=#525053,fg=#f7f1ff,bold] #S #[bg=#222222,fg=#222222] "

set -g window-status-current-format "#[fg=#f7f1ff,bold] #I:#W "
set -g window-status-format "#[fg=#69676c] #I:#W "

set -g pane-active-border-style "fg=#69676c"
set -g pane-border-style "fg=#525053"
set -g popup-border-style "fg=#525053"   # рамка попапов — в тон бордерам пейнов
