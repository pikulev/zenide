# Профиль: ЧТО чем реализовано и ЧТО включено. Читается диспетчером zenide.
# Это не фича-флаги: здесь только ВЫБОР из слота и СПИСОК модулей. Наличие
# тулов (rga, bat, delta, macism) не настраивается — оно определяется в
# рантайме; спроси `zenide doctor`, что найдено и что из-за этого отвалится.

# ── слоты: кто играет роль ─────────────────────────────
editor=helix      # каталог в libexec/zenide/editor/ (операции: open ctx reload goto)
git_tui=lazygit   # lazygit | gitui | tig
files=yazi        # файловый менеджер в постоянном окне
search=scooter    # search & replace по проекту

# ── модули: opt-in ПОВЕДЕНИЕ ───────────────────────────
# Доступные — каталоги в modules/.
#
#   keyboard-force-latin     форс ABC на любом переходе по tmux (нужен macism).
#                            Полезен всем, у кого есть нелатинская раскладка.
#   keyboard-cyrillic-twins  кириллические двойники prefix-биндов: C-Space ф
#                            работает так же, как C-Space a. Только для RU.
#
# ПУСТО — и это осознанный дефолт поставки, а не недонастроенность: оба модуля
# трогают системную раскладку, то есть ведут себя за пределами tmux. Включать
# такое за человека нельзя — он должен выбрать сам.
modules=""

# Своё — в modules.local (под .gitignore): раскладка и выбор инструментов
# машинно-зависимы, а трекаемый файл раздаётся всем, кто клонировал.
# shellcheck source=/dev/null
[ -r "$ZENIDE_PROFILE/modules.local" ] && . "$ZENIDE_PROFILE/modules.local"
