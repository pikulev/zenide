# Инструменты для работы НАД ЭТИМ репозиторием — не для сетапа, который он
# ставит. Нужен ровно для одного: чтобы `./tests/run.sh` давал один результат
# на любой машине. shellcheck и shfmt ломают сборку по-разному в разных
# версиях (новое правило → красный линт на коде, который вчера был зелёным),
# а brew умеет только «последнее» и запинить версию не может.
#
# Здесь СОЗНАТЕЛЬНО только `[tools]` с точными версиями и ничего больше:
# такой файл mise разрешает читать БЕЗ `mise trust`. Стоит добавить сюда
# `[tool_config]`, `[env]`, `[tasks]` или шаблон — и файл начинает требовать
# доверия, а у всякого, кто просто сделал `cd` в клон с установленным mise,
# на каждый вход в каталог поедет `mise ERROR … are not trusted`. Проверено:
# ровно `[tool_config] locked = true` это и включало. Чужой клон не должен
# ругаться — поэтому строгий режим здесь выключен, а пин держится тем, что
# версии названы точно (не диапазоном), плюс чексуммами из `mise.lock`.
#
# Завёл тул — сразу `mise lock` и коммить lock рядом: без него чексумм нет
# (чексумма из лока сверяется после скачивания и так, строгий режим для этого
# не нужен; нужен разово — `mise install --locked`, без правки файла).
# `cd` сюда переключает окружение: версии ниже отличаются от brew-овых, это
# намеренно, обратно — просто выйти из каталога.
#
# Версии — те, на которых репозиторий зелёный сейчас. Поднимать осознанно и
# отдельным коммитом: `mise up shellcheck` + `./tests/run.sh`.

[tools]
shellcheck = "0.11.0"
shfmt = "3.13.1"
